name: Build VPN Scan APK

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir -p src
          if [ -f vpn-scan-src.zip ]; then
            unzip -o -q vpn-scan-src.zip -d src
          else
            cp -r source/. src/
          fi
          ls -R src | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Go برای ساخت موتورهای تونل DNS (MasterDNS، StormDNS، CottenDNS، Soar) از سورس اصلی‌شان
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      # هستهٔ Xray (libv2ray.aar) را خود gradle موقع بیلد دانلود می‌کند
      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk VPN-Scan.apk
          gh release create "v${{ github.run_number }}" VPN-Scan.apk \
            --title "VPN Scan v${{ github.run_number }}" \
            --notes "Made by Reza (R.S) - download VPN-Scan.apk and install." \
            --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: VPN-Scan-apk
          path: VPN-Scan.apk
