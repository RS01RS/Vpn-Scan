name: Build VPN Scan APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir -p src
          unzip -o -q vpn-scan-src.zip -d src
          ls -R src | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk VPN-Scan.apk
          gh release create "v${{ github.run_number }}" VPN-Scan.apk \
            --title "VPN Scan v${{ github.run_number }}" \
            --notes "Made by Reza (R.S) - download VPN-Scan.apk and install." \
            --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: VPN-Scan-apk
          path: VPN-Scan.apk
